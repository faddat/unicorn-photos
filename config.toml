# --- General Settings ---
snapshot_base_dir = "snapshots"
ipfs_repo_path = "~/.unicorn-photos/ipfs"
max_pinned_size_gb = 100
log_level = "info" # e.g., debug, info, warn, error

# --- Chain Source & Filtering ---
# Path to the local clone of the cosmos/chain-registry repository
# Required if all_chains = true OR if chains_to_snapshot is used
chain_registry_path = "~/.chain-registry"

# Set to true to attempt snapshotting ALL 'mainnet' chains found in the registry.
# If true, 'chains_to_snapshot' is ignored. Overrides in [[chains]] still apply.
all_chains = true

# If all_chains = false, snapshot only these specific chains (names from registry folders).
# Overrides in [[chains]] can modify these. If this list is empty, ONLY chains
# defined explicitly in [[chains]] blocks below will be processed.
chains_to_snapshot = ["osmosis", "juno", "cosmoshub"] # Example: use registry folder names

# --- Default Snapshot/Pruning Settings (used if not overridden per chain) ---
global_snapshot_interval = "4h" # Default interval for chains processed
global_max_snapshots_to_keep = 10 # Default number of snapshots to keep per chain
global_prune_interval = "1h" # Default frequency to check for pruning per chain

# --- Chain Specific Overrides (Optional) ---
# Use these blocks to:
# 1. Override settings for chains selected via 'all_chains' or 'chains_to_snapshot'.
# 2. Explicitly define chains to snapshot if 'all_chains=false' and 'chains_to_snapshot' is empty.
# 3. Add chains NOT present in the registry (must provide chain_id and seeds).

# IPFS bootstrap peers (optional, adds to default IPFS bootstrap list)
bootstrap_peers = [
  "/dnsaddr/bootstrap.libp2p.io/p2p/QmNnooDu7bfjPFoTZYxMNLWUQJyrVwtbZg5gBMjTezGAJN",
  "/dnsaddr/bootstrap.libp2p.io/p2p/QmQCU2EcMqAqQPR2i9bChDtGNJchTbq5TbXJJ16u19uLTa",
  "/dnsaddr/bootstrap.libp2p.io/p2p/QmbLHAnMoJPWSCR5Zhtx6BHJX9KiKNN6tpvbUcqanj75Nb",
  "/dnsaddr/bootstrap.libp2p.io/p2p/QmcZf59bWwK5XFi76CZX8cbJ4BhTzzA3gU1ZjYZcYW3dwt"
]

# This section allows you to configure snapshots for specific chains.
# If you want to snapshot a chain that is not in the registry, you can add it here.
# If you want to override the global settings for a specific chain, you can do so here.
# If you want to disable a chain from being snapshot, you can set enabled = false.

[[chains]]
# 'name' here MUST match the folder name in the chain-registry if overriding.
# If adding a non-registry chain, this name is just for logging.
name = "cosmoshub"
enabled = true # Explicitly enable/disable (defaults to true if selected)
# chain_id = "cosmoshub-4" # Usually inferred from registry, needed if not in registry
snapshot_interval = "1h" # Override global interval
max_snapshots_to_keep_per_chain = 20 # Override global keep count
prune_interval = "30m" # Override global prune check frequency
# Provide specific seeds/peers if registry data is insufficient or needs overriding
# seed_nodes_p2p = ["seed1@host:port", "seed2@host:port"]
# Provide hint endpoints if discovery struggles (optional)
# rpc_endpoints = ["https://rpc.cosmoshub.quicksilver.zone:443"]
# rest_endpoints = ["https://rest.cosmoshub.quicksilver.zone:443"]
# enable_peer_discovery_fallback = true # Default is true if seeds are available

[[chains]]
name = "juno"
# Keep defaults from global settings, just ensure it's processed
enabled = true

[[chains]]
name = "some-local-testnet"  # Unique identifier
chain_id = "local-1"  # Must match Chain ID on network
enabled = true
snapshot_interval = "15m"
seed_nodes_p2p = ["seed@127.0.0.1:26656"]
rpc_endpoints = ["http://127.0.0.1:26657"]
rest_endpoints = ["http://127.0.0.1:1317"]